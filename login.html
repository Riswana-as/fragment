

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" crossorigin="anonymous" />

  <style>
    .log {
      background-image: url(./login.png);
      height: 390px;
      width: 100%;
      max-width: 390px;
      border-top-right-radius: 150px;
      border-bottom-left-radius: 150px;
      text-align: center;
      align-content: center;
      background-size: cover;
      background-position: center;
      margin-bottom: 20px; 
    }

    .btn-custom {       
      background-color: white;
      color: black;
      border: 1px solid #ccc;
      font-weight: 500;
    }

    .btn1 {   
      background-color: rgb(5, 62, 81);
      color: white;
      border: none;
      border-radius: 4px;
      height: 40px;
    }
     
    .form-control {
      background-color: gainsboro;
    }
  </style>
</head>
<body>
  <div class="container min-vh-100 d-flex align-items-center">
    <div class="row w-100 justify-content-center align-items-center">

      
      <div class="col-12 col-md-5 d-flex justify-content-center">
        <div class="log text-white d-flex flex-column justify-content-center p-3">
          <h2>Let's Get Started!</h2>
          <p>Create your account and unlock the<br> full potential of Fragranzia</p>
        </div>
      </div>

      
      <div class="col-12 col-md-6 d-flex flex-column justify-content-center px-4">
        
        <div class="d-flex flex-row gap-3 mb-3">
          <button class="btn btn-custom border border-2 border-dark w-50">
            <img src="https://img.icons8.com/color/16/google-logo.png" alt="">   Google
          </button>
          <button class="btn btn-custom border border-2 border-dark w-50">
            <i class="fa-brands fa-facebook-f" style="color: #349eef;"></i>Facebook
          </button>
        </div>

      
        <div class="d-flex align-items-center my-3 w-100">
          <hr class="flex-grow-1">
          <span class="px-2 text-muted small">Or sign up with email</span>
          <hr class="flex-grow-1">
        </div>

        
        <form>
          <div class="position-relative mb-3">
            <i class="fa-regular fa-circle-user position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
            <input type="text" class="form-control ps-5 rounded-2" placeholder="Enter your username">
          </div>
          <div class="position-relative mb-3">
            <i class="fa fa-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
            <input type="password" class="form-control ps-5 rounded-2" placeholder="Enter your password">
          </div>
                 <div class="check text-end">
            <label class="form-check-label" for="terms"> </label>
            <a href="T">forgot password</a>
        </div>
    <br>


          <button type="submit" class="btn1 w-100">Sign Up</button>
          <p class="text-center mt-2">Don't have an account? <a href="./login.html">Log In</a></p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
